name: Build & Auto Deploy para Branch deploy (Hostinger)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Compilar e Atualizar Branch deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório (main)
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências (Strict Lockfile)
        run: npm ci

      - name: 🧪 Checagem de Tipagem
        run: npm run lint

      - name: 🔨 Gerar Build de Produção
        run: npm run build

      - name: 🚀 Publicar arquivos compilados na branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          keep_files: false
          commit_message: "deploy: atualizacao automatica da producao (dist) [skip ci]"
